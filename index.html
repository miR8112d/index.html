<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chikiq Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    height:100vh;
    background:
    radial-gradient(circle at top left,#1f1f1f,#000000 70%);
    overflow:hidden;
    color:white;
}

/* BACKGROUND GLOW */

.glow{
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(255,255,255,0.06);
    border-radius:50%;
    filter:blur(120px);
    animation:move 10s infinite alternate;
}

.glow:nth-child(1){
    top:-150px;
    left:-100px;
}

.glow:nth-child(2){
    bottom:-150px;
    right:-100px;
}

@keyframes move{
    from{
        transform:translateY(0px);
    }
    to{
        transform:translateY(50px);
    }
}

/* MAIN BOX */

.container{
    position:relative;
    z-index:2;

    width:420px;
    padding:40px;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);

    backdrop-filter:blur(14px);

    border-radius:25px;

    box-shadow:
    0 0 30px rgba(255,255,255,0.08);

    text-align:center;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);
}

/* TITLE */

.logo{
    font-size:42px;
    font-weight:700;
    letter-spacing:2px;

    margin-bottom:10px;

    background:linear-gradient(to right,#ffffff,#7d7d7d);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    color:#cfcfcf;
    font-size:15px;
    margin-bottom:35px;
}

/* BUTTONS */

.btn{
    width:100%;
    padding:15px;

    margin-top:15px;

    border:none;
    border-radius:14px;

    background:linear-gradient(135deg,#ffffff,#8f8f8f);

    color:black;
    font-size:16px;
    font-weight:600;

    cursor:pointer;

    transition:0.25s;
}

.btn:hover{
    transform:scale(1.04);
    box-shadow:0 0 20px rgba(255,255,255,0.35);
}

/* DISCORD BOX */

.discord-box{
    margin-top:20px;
    padding:15px;

    border-radius:14px;

    background:rgba(255,255,255,0.05);

    display:none;
}

.discord-link{
    color:white;
    word-break:break-all;
    margin-bottom:12px;
    font-size:14px;
}

.copy-btn{
    width:100%;
    padding:12px;

    border:none;
    border-radius:12px;

    background:white;
    color:black;

    font-weight:600;
    cursor:pointer;

    transition:0.25s;
}

.copy-btn:hover{
    transform:scale(1.03);
}

/* FOOTER */

.footer{
    margin-top:25px;
    color:#9e9e9e;
    font-size:13px;
}

</style>
</head>

<body>

<div class="glow"></div>
<div class="glow"></div>

<div class="container">

    <div class="logo">
        CHIKIQ HUB
    </div>

    <div class="subtitle">
        Ultimate Gaming Experience
    </div>

    <button class="btn" onclick="alert('Purchase clicked')">
        PURCHASE
    </button>

    <button class="btn" onclick="showDiscord()">
        DISCORD
    </button>

    <div class="discord-box" id="discordBox">

        <div class="discord-link" id="discordLink">
            https://discord.gg/HeU5QKPNY
        </div>

        <button class="copy-btn" onclick="copyDiscord()">
            COPY LINK
        </button>

    </div>

    <div class="footer">
        © 2026 Chikiq Hub
    </div>

</div>

<script>

function showDiscord(){
    document.getElementById("discordBox").style.display = "block";
}

function copyDiscord(){

    const link = "https://discord.gg/HeU5QKPNY";

    navigator.clipboard.writeText(link);

    alert("Discord link copied!");
}

</script>

</body>
</html>
